<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prospero Music Studio</title>
<link rel="stylesheet" href="/music.css">
</head>
<body>
<header>
  <div id="brand">🎵 Prospero <span>Music Studio</span></div>
  <span id="uiver" title="UI version">UI v23</span>
  <select id="model" title="Music model"></select>
  <span id="status-dot" class="dot"></span>
</header>
<main>
  <section id="composer">
    <label for="lyrics">Lyrics</label>
    <textarea id="lyrics" rows="10" placeholder="[verse]
Write your lyrics here..."></textarea>
    <label for="style">Style (prompt)</label>
    <input id="style" type="text" placeholder="romanian pop, female vocal, deep bass...">
    <details id="row-abc" open>
      <summary id="abc-summary">ABC notation &amp; advanced options</summary>
      <div id="abc-col">
        <label for="abc">ABC notation (optional)</label>
        <textarea id="abc" rows="8" placeholder="X:1&#10;M:2/4&#10;L:1/16&#10;K:C..."></textarea>
        <div id="abc-actions">
          <input id="abc-name" type="text" value="studio.abc">
          <button id="abc-save" type="button">Save ABC</button>
          <button id="abc-load" type="button">Load into editor</button>
          <select id="abc-files" title="Existing .abc files"></select>
          <input id="abc-disk" type="file" accept=".abc,text/plain" hidden>
          <button id="abc-open" type="button">📁 From file</button>
          <button id="abc-clear" type="button">✖ Clear</button>
        </div>
      </div>
      <div id="opts-col">
        <label for="cot">Melody guidance</label>
        <select id="cot">
          <option value="melody">cot=melody (ABC as guide)</option>
          <option value="">no cot (lyrics/style only)</option>
        </select>
        <label for="abc-max">abc_max_tokens</label>
        <input id="abc-max" type="number" value="2000" min="100" max="4000" step="100">
        <label for="duration">Duration (seconds)</label>
        <div id="dur-row"><input id="duration" type="range" min="30" max="300" step="5" value="240"><span id="dur-val">240</span></div>
        <label for="seed">Seed</label>
        <div id="seed-row"><input id="seed" type="number" value="42" min="1" max="4294967295"><button id="dice" type="button" title="random seed">🎲</button></div>
      </div>
    </details>
    <label for="track-name">Track name (optional — output file becomes „name_seed&lt;N&gt;.wav”)</label>
    <input id="track-name" type="text" placeholder="e.g. summer-sunshine" autocomplete="off">
    <div id="gen-row">
      <button id="generate" type="button">▶ GENERATE</button>
      <button id="regen" type="button" title="keep everything and generate again with seed +1">🎲+1</button>
    </div>
    <div id="gen-status"></div>
    <div id="result"></div>
  </section>
  <section id="library">
    <h2>Library <button id="refresh" type="button" title="refresh">⟳</button></h2>
    <div id="tracks"></div>
  </section>
</main>
<div id="key-bar" hidden>
  <input id="key-input" type="password" placeholder="API key (Authorization bearer)">
  <button id="key-save" type="button">Save</button>
</div>
<script src="/music.js"></script>
</body>
</html>
